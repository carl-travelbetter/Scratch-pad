<DOCTYPE! html>
  <html lang="en">
    <head>
      <title>SVG Playground</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta charset="UTF-8">
      <link rel="stylesheet" href="svgplay.css">
      <script src="svgplay.js" defer ></script>
    </head>
    <body>
      <h1>SVG Playground</h1>
      <p>A area for me to develop my SVG skills to use on Travelbetter and other developments</p>
      <h2>Path Play</h2>
      <svg height="400" width="400" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 0 L400 400" style="fill:none;stroke:purple;stroke-width:4"  />
      </svg>
      <h2>Elispe</h2>
      <svg height="200" width="500" xmlns="http://www.w3.org/2000/svg">
        <ellipse rx="100" ry="50" cx="100" cy="100"
        style="fill:yellow;stroke:green;stroke-width:3" />
      </svg>
      <h2>Circles</h2>
      <svg width="300" height="300" >
        <rect id="rectangle" class="basic-rectangle"  y="0" x="0" width="300" height="300" rx="10" ry="10" stroke="blue" stroke-width="4" fill="green"/>
        <circle id="circle" class="basic-circle" cx="250" cy="250" r="30" stroke="blue" stroke-width="4" fill="red"/>
      </svg>
      <h2>Battery</h2>
       <svg width="200" height="700" >
        <rect id="rectangle" class="basic-rectangle"  y="0" x="0" width="200" height="200" rx="10" ry="10" stroke="blue" stroke-width="4" fill="green"/>
        <rect id="rectangle" class="basic-rectangle"  y="200" x="0" width="200" height="300" rx="10" ry="10" stroke="blue" stroke-width="4" fill="orange"/>
        <rect id="rectangle" class="basic-rectangle"  y="500" x="0" width="200" height="200" rx="10" ry="10" stroke="blue" stroke-width="4" fill="red"/>
      </svg>
      <div class="control-card">
        <button class="svg-button" id="color-button">Click Me</button>
      </div>
    </body>
  </html>
