<DOCTYPE! html>
  <html lang="en">
    <head>
      <title>SVG Playground</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta charset="UTF-8">
      <link rel="stylesheet" href="svgplay.css">
      <script src="svgplay.js" defer ></script>
    </head>
    <body>
      <h1>SVG Playground</h1>
      <p>A area for me to develop my SVG skills to use on Travelbetter and other developments</p>
      <h2>Circles</h2>
      <svg width="200" height="200" >
        <circle id="circle" class="basic-circle" cx="100" cy="50" r="30" stroke="blue" stroke-width="4" fill="red"/>
      </svg>
      <div class="control-card">
        <button class="svg-button" id="color-button">Click Me</button>
      </div>
    </body>
  </html>
